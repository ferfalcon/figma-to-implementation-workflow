name: Validate UI
on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '*.config.*'
      - 'tsconfig.json'
      - '.github/workflows/validate-ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '*.config.*'
      - 'tsconfig.json'
      - '.github/workflows/validate-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the implementation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TESTED_COMMIT }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci
      - name: Check types
        id: types
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm run check
      - name: Build production output
        id: build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Install browser
        id: browsers
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify the built UI
        id: tests
        if: steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e
      - name: Report exact commit and check outcomes
        if: always()
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          TYPECHECK: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSERS: ${{ steps.browsers.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: node scripts/validation-report.mjs
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-validation-${{ github.run_id }}
          path: |
            validation-result.json
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
