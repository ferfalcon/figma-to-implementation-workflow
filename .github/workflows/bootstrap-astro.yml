name: Resolve Astro starter dependencies
on:
  push:
    branches: [codex/chatgpt-first-product]
    paths: [.github/workflows/bootstrap-astro.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Resolve exact stable versions and lockfile
        run: |
          mkdir starter
          cd starter
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const version = (name) => (() => { const result = JSON.parse(execFileSync('npm', ['view', name, 'version', '--json'], { encoding: 'utf8' })); return Array.isArray(result) ? result.at(-1) : result; })();
          const pkg = {
            name: 'design-workflow-astro-starter',
            version: '0.1.0',
            private: true,
            type: 'module',
            engines: { node: '>=22.12.0' },
            scripts: {
              dev: 'astro dev',
              check: 'astro check',
              build: 'astro build',
              preview: 'astro preview',
              'test:e2e': 'playwright test',
              validate: 'npm run check && npm run build && npm run test:e2e'
            },
            dependencies: { astro: version('astro') },
            devDependencies: {
              '@astrojs/check': version('@astrojs/check'),
              typescript: version('typescript@6'),
              '@playwright/test': version('@playwright/test'),
              '@axe-core/playwright': version('@axe-core/playwright')
            }
          };
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          execFileSync('npm', ['install', '--package-lock-only', '--ignore-scripts'], { stdio: 'inherit' });
          const fs = await import('node:fs');
          console.log('STARTER_PACKAGE_JSON=' + JSON.stringify(pkg));
          console.log('STARTER_LOCK_JSON=' + JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))));
          NODE
