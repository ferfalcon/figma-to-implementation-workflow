name: Publish consumer bundle

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out released toolkit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build consumer bundle
        run: >-
          node scripts/build-consumer-bundle.mjs
          --revision "${{ steps.revision.outputs.sha }}"
          --output dist/consumer-bundle

      - name: Package repository upload bundle
        run: |
          cd dist
          zip -r design-workflow-consumer.zip consumer-bundle

      - name: Upload consumer assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/design-workflow-consumer.zip
          dist/consumer-bundle/ChatGPT-Project-Instructions.md
          --clobber
