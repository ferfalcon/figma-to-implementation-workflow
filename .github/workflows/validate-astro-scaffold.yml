name: Validate Astro implementation scaffold
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: astro-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: implementation-adapters/astro/scaffold/package-lock.template.json
      - name: Generate the implementation scaffold
        run: node scripts/build-astro-scaffold.mjs --output dist/astro-scaffold
      - name: Install scaffold dependencies
        working-directory: dist/astro-scaffold
        run: npm ci
      - name: Check types
        working-directory: dist/astro-scaffold
        run: npm run check
      - name: Build production output
        working-directory: dist/astro-scaffold
        run: npm run build
      - name: Install browser
        working-directory: dist/astro-scaffold
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify built pages
        working-directory: dist/astro-scaffold
        run: npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astro-scaffold-browser-node-${{ matrix.node-version }}
          path: |
            dist/astro-scaffold/playwright-report/
            dist/astro-scaffold/test-results/
          if-no-files-found: ignore
