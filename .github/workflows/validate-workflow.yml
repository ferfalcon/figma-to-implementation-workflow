name: Validate workflow repository

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the repository validation contract
        run: npm run validate

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packaging leaves no generated provenance or repository drift
        run: |
          test ! -e cli/toolkit-provenance.json
          git diff --exit-code
