name: Validate workflow repository

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate structure, links, and workflow records
        run: node scripts/validate-workflow.mjs

      - name: Test semantic workflow validation
        run: node scripts/test-workflow-record.mjs

      - name: Test workflow CLI
        run: node scripts/test-cli.mjs

      - name: Verify package contents
        run: npm pack --dry-run
