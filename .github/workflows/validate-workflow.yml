name: Validate workflow repository

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate structure, links, workflow records, and generated views
        run: node scripts/validate-workflow.mjs

      - name: Test semantic workflow validation
        run: node scripts/test-workflow-record.mjs

      - name: Test generated workflow state
        run: node scripts/test-generated-state.mjs

      - name: Test workflow CLI
        run: node scripts/test-cli.mjs

      - name: Verify package contents
        run: npm pack --dry-run
