name: Bootstrap first stable toolkit release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-first-stable-release.yml

concurrency:
  group: bootstrap-first-stable-toolkit-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.4.0
  RELEASE_TAG: v0.4.0
  RELEASE_TARGET: ${{ github.event.before }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Check out the exact release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate release metadata
        run: node scripts/check-toolkit-release.mjs --version "$RELEASE_VERSION"

      - name: Run repository validation
        run: npm run validate

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packaging leaves no generated provenance or repository drift
        run: |
          test ! -e cli/toolkit-provenance.json
          git diff --exit-code

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact validated release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse an existing version tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

      - name: Create first stable toolkit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest

      - name: Verify exact released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -z "$TAG_SHA" ] || [ "$TAG_SHA" != "$RELEASE_TARGET" ]; then
            echo "Released tag ${RELEASE_TAG} resolved to ${TAG_SHA:-<missing>} instead of ${RELEASE_TARGET}." >&2
            exit 1
          fi
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish)"
          node -e 'const release = JSON.parse(process.argv[1]); if (release.isDraft || release.isPrerelease || release.tagName !== process.argv[2]) process.exit(1);' "$RELEASE_JSON" "$RELEASE_TAG"
